[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "sherlock-datahub"
version = "0.1.0"
description = "Sherlock — a metadata detective agent that investigates neglected DataHub assets and writes the knowledge back into the graph"
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.10"
dependencies = [
    "mcp>=1.2.0",
    "httpx>=0.27",
    "pydantic>=2.6",
    "rich>=13.7",
    "typer>=0.12",
]

[project.scripts]
sherlock = "sherlock.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["sherlock"]
